name: Build
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
          cache-version: 1
      - name: Run rubocop
        run: |
          bundle exec rubocop --parallel

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [ mysql, postgres, sqlite ]
        gemfile:
        - rails_7_1
        - rails_7_2
        - rails_8_0
        - rails_8_1
        - rails_main
        - solid_queue_1_7_0
        - solid_queue_1_7_1
        - solid_queue_1_7_2
        - solid_queue_main
        # Each Ruby runs once with a Rails, rather than with every Rails
        include:
          - { gemfile: rails_7_1, ruby-version: "3.2" }
          - { gemfile: rails_7_2, ruby-version: "3.3" }
          - { gemfile: rails_8_0, ruby-version: "3.4" }
          - { gemfile: rails_8_1, ruby-version: "4.0" }
          - { gemfile: rails_main, ruby-version: "4.0" }
          - { gemfile: solid_queue_1_7_0, ruby-version: "4.0" }
          - { gemfile: solid_queue_1_7_1, ruby-version: "4.0" }
          - { gemfile: solid_queue_1_7_2, ruby-version: "4.0" }
          - { gemfile: solid_queue_main, ruby-version: "4.0" }
    services:
      mysql:
        image: mysql:8.0.31
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 33066:3306
        options: --health-cmd "mysql -h localhost -e \"select now()\"" --health-interval 1s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:15.1
        env:
          POSTGRES_HOST_AUTH_METHOD: "trust"
        ports:
          - 55432:5432
    env:
      TARGET_DB: ${{ matrix.database }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          cache-version: 1
      - name: Update to latest Rails
        run: |
          bundle update railties
      - name: Setup test database
        run: |
          bin/rails db:setup
      - name: Run tests
        run: bin/rails test
      - name: Upload logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.database }}-${{ matrix.gemfile }}-ruby${{ matrix.ruby-version }}-attempt${{ github.run_attempt }}
          path: |
            test/dummy/log/test.log
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: Build
    needs: [ rubocop, tests ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: test "${{ needs.rubocop.result }}" = success && test "${{ needs.tests.result }}" = success
